name: Bug report
description: Report a reproducible problem in an explicitly published build.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version and artifact
      description: Provide the exact version and installer or executable name.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows environment
      description: Windows version, architecture, and display scaling.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Remove usernames, personal paths, credentials, and private files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, and private information.
          required: true
