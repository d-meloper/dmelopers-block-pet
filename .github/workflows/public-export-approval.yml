name: public-export-approval
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-export-approval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-export-approval:
    name: public-export-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify inspected source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo 'Inspected source differs from the requested head' >&2
            exit 1
          fi
      - name: Review introduced dependencies for vulnerabilities
        # Personal private source previews cannot use GitHub dependency review.
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          license-check: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test public source checks
        run: node --test .github/scripts/public-check.test.mjs
      - name: Verify public source files and assets
        run: node .github/scripts/public-check.mjs
      # Native/Store production is verified locally from reviewed source once.
      # Public CI does not build binaries, upload artifacts or retain binary caches.
