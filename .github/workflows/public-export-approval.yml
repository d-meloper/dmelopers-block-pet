name: public-export-approval
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-export-approval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-export-approval:
    name: public-export-approval
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify inspected source identity
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_HEAD) { throw 'Inspected source differs from the requested head' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test .github/scripts/public-check.test.mjs
      - run: node .github/scripts/public-check.mjs
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: python -m unittest discover -s scripts/packaging -p test_*.py
        working-directory: app
      - name: Build and validate NSIS and MSIX (synthetic identity only)
        shell: pwsh
        working-directory: app
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/packaging/build.ps1 --validation --reviewed-public-commit (git rev-parse HEAD) --output "$env:RUNNER_TEMP/block-pet-package-check"
      # No upload-artifact, release upload, or binary-bearing public cache.
      # These outputs prove build checks only; releases are produced locally.
