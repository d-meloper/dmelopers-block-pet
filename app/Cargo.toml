[workspace]
resolver = "2"
members = [ "src-tauri" ]

[profile.release]
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
lto = true

[workspace.dependencies]
log = "0.4"
tauri = "2.11.1"
serde = "1"
serde_json = { version = "1", features = [ "float_roundtrip" ] }
tauri-plugin = { version = "2", features = [ "build" ] }
tauri-plugin-custom-window = { path = "./src-tauri/src/plugins/window" }

[patch.crates-io]
# tauri-winres 0.3.5 incorrectly prefixes apostrophes in Windows version metadata.
tauri-winres = { path = "vendor/tauri-winres" }
