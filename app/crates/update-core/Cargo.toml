[package]
name = "block-pet-update-core"
version = "1.0.0"
edition = "2024"
description = "Byte-bound update worker and shared recovery protocol for 3D Block Pet"
license = "MIT"
authors = ["DMeloper"]

[lib]
name = "block_pet_update_core"

[[bin]]
name = "block-pet-update-worker"
path = "src/worker.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
log = "0.4"
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Environment", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
serde_json = "1"
toml = "0.9"
tauri-winres = "0.3.5"

[dev-dependencies]
sysinfo = "0.39"
tempfile = "3"

[features]
test-repository = []
private-update-qa = []
