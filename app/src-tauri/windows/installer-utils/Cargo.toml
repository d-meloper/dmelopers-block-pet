[package]
name = "block-pet-installer-utils"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[workspace]
members = ["vendor/nsis-plugin-api", "vendor/nsis-fn"]
resolver = "2"

[workspace.dependencies.windows-sys]
version = "=0.61.2"
features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
]

[dependencies]
nsis-plugin-api = { path = "vendor/nsis-plugin-api" }
windows-sys = { workspace = true }
semver = { version = "=1.0.27", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
